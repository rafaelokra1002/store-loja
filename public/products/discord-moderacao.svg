<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a0f"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="spot" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#spot)"/>
  <!-- Shield icon -->
  <g transform="translate(400,160)" filter="url(#glow)">
    <path d="M0-70 L60-45 L60 20 L0 70 L-60 20 L-60-45 Z" fill="none" stroke="#00ff88" stroke-width="3"/>
    <path d="M-20-10 L-5 10 L25-20" fill="none" stroke="#00ff88" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Discord icon -->
  <g transform="translate(400,160)" opacity="0.15">
    <circle cx="80" cy="-30" r="25" fill="#5865F2"/>
    <circle cx="-80" cy="30" r="20" fill="#5865F2"/>
  </g>
  <!-- Text -->
  <text x="400" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="38" fill="white" letter-spacing="2">BOT MODERAÇÃO</text>
  <text x="400" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="42" fill="url(#accent)" letter-spacing="3">PRO</text>
  <text x="400" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#888" letter-spacing="4">DISCORD • AUTO-MOD • ANTI-SPAM</text>
  <!-- Badge -->
  <rect x="310" y="400" width="180" height="36" rx="18" fill="#00ff88" opacity="0.9"/>
  <text x="400" y="424" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#000">⚡ MAIS VENDIDO</text>
  <!-- Decorative lines -->
  <line x1="100" y1="460" x2="700" y2="460" stroke="#00ff88" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="150" y1="470" x2="650" y2="470" stroke="#00ff88" stroke-opacity="0.05" stroke-width="1"/>
</svg>
