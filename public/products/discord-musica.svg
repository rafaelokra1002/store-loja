<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a1a"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="spot" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#spot)"/>
  <!-- Music note icon -->
  <g transform="translate(400,150)" filter="url(#glow)">
    <circle cx="-25" cy="30" r="18" fill="none" stroke="#a855f7" stroke-width="3"/>
    <circle cx="25" cy="20" r="18" fill="none" stroke="#a855f7" stroke-width="3"/>
    <line x1="-7" y1="30" x2="-7" y2="-40" stroke="#a855f7" stroke-width="3"/>
    <line x1="43" y1="20" x2="43" y2="-50" stroke="#a855f7" stroke-width="3"/>
    <line x1="-7" y1="-40" x2="43" y2="-50" stroke="#a855f7" stroke-width="3"/>
  </g>
  <!-- Decorative -->
  <circle cx="650" cy="120" r="35" fill="#5865F2" opacity="0.08"/>
  <circle cx="150" cy="350" r="25" fill="#a855f7" opacity="0.06"/>
  <!-- Text -->
  <text x="400" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="36" fill="white" letter-spacing="2">BOT MÚSICA</text>
  <text x="400" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="42" fill="url(#accent)" letter-spacing="3">PREMIUM</text>
  <text x="400" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#888" letter-spacing="4">YOUTUBE • SPOTIFY • SOUNDCLOUD</text>
  <!-- Badge -->
  <rect x="310" y="400" width="180" height="36" rx="18" fill="#a855f7" opacity="0.9"/>
  <text x="400" y="424" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#fff">🎵 HI-FI AUDIO</text>
</svg>
