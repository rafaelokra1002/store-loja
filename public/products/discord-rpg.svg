<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a0a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="spot" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#spot)"/>
  <!-- Sword + shield RPG icon -->
  <g transform="translate(400,145)" filter="url(#glow)">
    <line x1="-30" y1="40" x2="30" y2="-40" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="-40" x2="40" y2="-30" stroke="#fbbf24" stroke-width="3"/>
    <line x1="30" y1="-40" x2="40" y2="-20" stroke="#fbbf24" stroke-width="3"/>
    <polygon points="-40,-10 -20,-35 0,-10 -20,15" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <!-- Dice dots -->
    <circle cx="50" cy="30" r="4" fill="#fbbf24" opacity="0.5"/>
    <circle cx="-50" cy="-30" r="3" fill="#fbbf24" opacity="0.4"/>
  </g>
  <!-- Decorative -->
  <circle cx="650" cy="100" r="35" fill="#fbbf24" opacity="0.05"/>
  <circle cx="150" cy="380" r="25" fill="#5865F2" opacity="0.05"/>
  <!-- Text -->
  <text x="400" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="36" fill="white" letter-spacing="2">BOT DISCORD</text>
  <text x="400" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="42" fill="url(#accent)" letter-spacing="3">RPG GAME</text>
  <text x="400" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#888" letter-spacing="4">COMBATE • QUESTS • ECONOMIA</text>
  <!-- Badge -->
  <rect x="310" y="400" width="180" height="36" rx="18" fill="#fbbf24" opacity="0.9"/>
  <text x="400" y="424" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#000">⚔️ RPG COMPLETO</text>
</svg>
