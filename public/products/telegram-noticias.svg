<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a1a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0088cc"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="spot" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#spot)"/>
  <!-- Newspaper/news icon -->
  <g transform="translate(400,145)" filter="url(#glow)">
    <rect x="-45" y="-40" width="90" height="80" rx="8" fill="none" stroke="#00d4ff" stroke-width="3"/>
    <line x1="-30" y1="-22" x2="30" y2="-22" stroke="#00d4ff" stroke-width="2"/>
    <line x1="-30" y1="-8" x2="10" y2="-8" stroke="#00d4ff" stroke-width="2" opacity="0.6"/>
    <line x1="-30" y1="6" x2="20" y2="6" stroke="#00d4ff" stroke-width="2" opacity="0.4"/>
    <line x1="-30" y1="20" x2="5" y2="20" stroke="#00d4ff" stroke-width="2" opacity="0.3"/>
    <circle cx="25" cy="15" r="12" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>
  </g>
  <!-- Text -->
  <text x="400" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="36" fill="white" letter-spacing="2">BOT TELEGRAM</text>
  <text x="400" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="42" fill="url(#accent)" letter-spacing="3">NOTÍCIAS</text>
  <text x="400" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#888" letter-spacing="4">FONTES • RESUMO IA • ALERTAS</text>
  <!-- Badge -->
  <rect x="310" y="400" width="180" height="36" rx="18" fill="#00d4ff" opacity="0.9"/>
  <text x="400" y="424" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#000">📰 NEWS BOT</text>
</svg>
