<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a1a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0088cc"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="spot" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#0088cc" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#spot)"/>
  <!-- Paper plane icon -->
  <g transform="translate(400,150)" filter="url(#glow)">
    <polygon points="-50,0 50,-40 10,10" fill="none" stroke="#0088cc" stroke-width="3" stroke-linejoin="round"/>
    <line x1="10" y1="10" x2="50" y2="-40" stroke="#0088cc" stroke-width="3"/>
    <line x1="10" y1="10" x2="10" y2="45" stroke="#0088cc" stroke-width="3"/>
    <line x1="10" y1="45" x2="28" y2="25" stroke="#0088cc" stroke-width="3"/>
  </g>
  <!-- Cart icon -->
  <g transform="translate(400,155)" opacity="0.15">
    <circle cx="75" cy="40" r="20" fill="#0088cc"/>
    <circle cx="-75" cy="-20" r="15" fill="#00d4ff"/>
  </g>
  <!-- Text -->
  <text x="400" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="36" fill="white" letter-spacing="2">BOT TELEGRAM</text>
  <text x="400" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="42" fill="url(#accent)" letter-spacing="3">VENDAS</text>
  <text x="400" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#888" letter-spacing="4">CATÁLOGO • CARRINHO • PIX</text>
  <!-- Badge -->
  <rect x="310" y="400" width="180" height="36" rx="18" fill="#0088cc" opacity="0.9"/>
  <text x="400" y="424" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#fff">🛒 E-COMMERCE</text>
</svg>
