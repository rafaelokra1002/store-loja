<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a0f"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0f1a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#25D366"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="spot" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#25D366" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#spot)"/>
  <!-- Chat bubble icon -->
  <g transform="translate(400,155)" filter="url(#glow)">
    <rect x="-50" y="-40" width="100" height="70" rx="15" fill="none" stroke="#25D366" stroke-width="3"/>
    <polygon points="-20,30 -10,50 10,30" fill="none" stroke="#25D366" stroke-width="3"/>
    <circle cx="-20" cy="-5" r="5" fill="#25D366"/>
    <circle cx="0" cy="-5" r="5" fill="#25D366"/>
    <circle cx="20" cy="-5" r="5" fill="#25D366"/>
  </g>
  <!-- WhatsApp circles -->
  <circle cx="620" cy="100" r="40" fill="#25D366" opacity="0.08"/>
  <circle cx="180" cy="380" r="30" fill="#25D366" opacity="0.06"/>
  <!-- Text -->
  <text x="400" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="36" fill="white" letter-spacing="2">BOT WHATSAPP</text>
  <text x="400" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="40" fill="url(#accent)" letter-spacing="3">ATENDIMENTO</text>
  <text x="400" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#888" letter-spacing="4">MENU INTERATIVO • AUTO-RESPOSTA</text>
  <!-- Badge -->
  <rect x="310" y="400" width="180" height="36" rx="18" fill="#25D366" opacity="0.9"/>
  <text x="400" y="424" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#000">💬 AUTOMÁTICO</text>
</svg>
