<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a0f"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0f1a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#25D366"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="spot" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#25D366" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#spot)"/>
  <!-- Group/people icon -->
  <g transform="translate(400,145)" filter="url(#glow)">
    <circle cx="0" cy="-15" r="18" fill="none" stroke="#25D366" stroke-width="3"/>
    <path d="M-35,35 C-35,10 -15,-5 0,5 15,-5 35,10 35,35" fill="none" stroke="#25D366" stroke-width="3"/>
    <circle cx="-45" cy="-5" r="13" fill="none" stroke="#25D366" stroke-width="2" opacity="0.5"/>
    <circle cx="45" cy="-5" r="13" fill="none" stroke="#25D366" stroke-width="2" opacity="0.5"/>
  </g>
  <!-- Text -->
  <text x="400" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="white" letter-spacing="2">BOT WHATSAPP</text>
  <text x="400" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="38" fill="url(#accent)" letter-spacing="3">GRUPO MANAGER</text>
  <text x="400" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#888" letter-spacing="4">ANTI-LINK • BEM-VINDO • MODERAÇÃO</text>
  <!-- Badge -->
  <rect x="310" y="400" width="180" height="36" rx="18" fill="#25D366" opacity="0.9"/>
  <text x="400" y="424" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#000">👥 GRUPOS</text>
</svg>
